<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2D33"/>
      <stop offset="1" stop-color="#16181C"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.3" fill="#FFFFFF" fill-opacity="0.13"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="r"><rect x="8" y="8" width="240" height="240" rx="54"/></clipPath>
  </defs>

  <g clip-path="url(#r)">
    <rect x="8" y="8" width="240" height="240" fill="url(#bg)"/>
    <rect x="8" y="8" width="240" height="240" fill="url(#dots)"/>
  </g>
  <rect x="8.5" y="8.5" width="239" height="239" rx="53.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- cartão de trás (azul) -->
  <g filter="url(#sh)" transform="rotate(-8 170 80)">
    <rect x="112" y="40" width="112" height="76" rx="12" fill="#1C1E22"/>
    <path d="M112 52a12 12 0 0 1 12-12h88a12 12 0 0 1 12 12v8H112z" fill="#2F7597"/>
    <circle cx="124" cy="50" r="3.6" fill="#fff" fill-opacity="0.85"/>
    <rect x="124" y="74" width="40" height="6" rx="3" fill="#fff" fill-opacity="0.22"/>
    <rect x="124" y="88" width="60" height="6" rx="3" fill="#fff" fill-opacity="0.14"/>
  </g>

  <!-- cartão do meio (verde) -->
  <g filter="url(#sh)" transform="translate(-6 10) rotate(7 80 180)">
    <rect x="30" y="140" width="108" height="76" rx="12" fill="#1C1E22"/>
    <path d="M30 152a12 12 0 0 1 12-12h84a12 12 0 0 1 12 12v8H30z" fill="#3E7D4C"/>
    <circle cx="42" cy="150" r="3.6" fill="#fff" fill-opacity="0.85"/>
    <rect x="42" y="174" width="52" height="6" rx="3" fill="#fff" fill-opacity="0.22"/>
    <rect x="42" y="188" width="34" height="6" rx="3" fill="#fff" fill-opacity="0.14"/>
  </g>

  <!-- cartão da frente (amarelo) com prompt -->
  <g filter="url(#sh)" transform="translate(12 -6) rotate(-3 128 128)">
    <rect x="58" y="78" width="146" height="104" rx="14" fill="#1F2125"/>
    <rect x="58.5" y="78.5" width="145" height="103" rx="13.5" fill="none" stroke="#fff" stroke-opacity="0.07"/>
    <path d="M58 92a14 14 0 0 1 14-14h118a14 14 0 0 1 14 14v10H58z" fill="#8E7627"/>
    <circle cx="73" cy="90" r="4.2" fill="#fff" fill-opacity="0.9"/>
    <path d="M78 122l18 14-18 14" fill="none" stroke="#F2F2F2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="104" y="144" width="34" height="9" rx="4.5" fill="#E9C46A"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
